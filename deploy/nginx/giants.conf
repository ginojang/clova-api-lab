# ── LLM 비교-분석-정리 (giants) — Vite SPA + Express 프록시 ─────────
# 저장소/서비스 식별자는 clova-api-lab, 프런트 노출 명칭은 "LLM 비교-분석-정리".
# EC2 EldaFront(구 AmazonFront) /etc/nginx/default.d/giants.conf 로 설치됨.
# 파일 루트: /var/www/giants/  (nginx root /var/www + /giants/)
# 백엔드: hellcat 의 Express 가 autossh 역방향 터널로 127.0.0.1:3600 에 listen.
# 루트(/) 302→/admin/ 은 elda(admin.conf) 소유이므로 여기서 건드리지 않는다.
#
# 공개 경로 이력:  /giant/clova/ → /giant/ (2026-07-30) → /giants/ (2026-07-30)
# 구 설치 파일(default.d/giant-clova.conf, default.d/giant.conf)은 deploy.sh 가
# 제거한다 — 남아 있으면 location 중복으로 nginx -t 가 실패하고, 그러면 이 EC2 의
# 다른 사이트(/admin 등)까지 reload 가 막힌다.
#
# 주의 — 이 파일은 nginx.conf 의 default server block(server_name `_ elda-ai.org
# agent.elda-ai.org`, 443 ssl/Let's Encrypt)에만 include 된다. conf.d/api.elda-ai.org.conf
# 가 먼저 로드되어 443 default_server 를 선점하므로, Host 가 elda-ai.org 계열이 아닌
# 요청(예: ec2-43-201-28-94... 공용 DNS)은 여기 도달하지 못하고 404 가 된다.
# 접속은 https://elda-ai.org/giants/ (또는 agent.elda-ai.org) 로.

# 구 경로 호환 — 북마크/외부 링크를 새 경로로 넘긴다.
# /giant/clova/ 가 /giant/ 보다 prefix 가 길어 먼저 매칭된다.
# (/giants/... 는 "/giant/" prefix 에 걸리지 않는다 — 7번째 문자가 's' vs '/')
location /giant/clova/ {
    return 301 /giants/;
}

location /giant/ {
    return 301 /giants/;
}

location /giants/ {
    try_files $uri $uri/ /giants/index.html;
}

# Vite 해시 에셋 — 장기 캐시(immutable)
location /giants/assets/ {
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}

# 프록시: /giants/api/* → 127.0.0.1:3600/api/*
location /giants/api/ {
    proxy_pass http://127.0.0.1:3600/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SSE 스트리밍: 버퍼링 끄고 즉시 flush (chat/stream 용)
    proxy_buffering off;
    proxy_cache off;
}

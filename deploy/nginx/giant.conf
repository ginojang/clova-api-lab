# ── CLOVA API Lab (giant) — Vite SPA + Express 프록시 ───────────────
# EC2 EldaFront(구 AmazonFront) /etc/nginx/default.d/giant.conf 로 설치됨.
# 파일 루트: /var/www/giant/  (nginx root /var/www + /giant/)
# 백엔드: hellcat 의 Express 가 autossh 역방향 터널로 127.0.0.1:3600 에 listen.
# 루트(/) 302→/admin/ 은 elda(admin.conf) 소유이므로 여기서 건드리지 않는다.
#
# 공개 경로는 2026-07-30 에 /giant/clova/ → /giant/ 로 한 단계 올렸다.
# 구 설치 파일 default.d/giant-clova.conf 는 deploy.sh 가 제거한다
# (남아 있으면 location 중복으로 nginx -t 실패).
#
# 주의 — 이 파일은 nginx.conf 의 default server block(server_name `_ elda-ai.org
# agent.elda-ai.org`, 443 ssl/Let's Encrypt)에만 include 된다. conf.d/api.elda-ai.org.conf
# 가 먼저 로드되어 443 default_server 를 선점하므로, Host 가 elda-ai.org 계열이 아닌
# 요청(예: ec2-43-201-28-94... 공용 DNS)은 여기 도달하지 못하고 404 가 된다.
# 접속은 https://elda-ai.org/giant/ (또는 agent.elda-ai.org) 로.

# 구 경로 호환 — 북마크/외부 링크를 새 경로로 넘긴다.
# prefix 가 더 길어 아래 /giant/ 블록보다 우선 매칭된다.
location /giant/clova/ {
    return 301 /giant/;
}

location /giant/ {
    try_files $uri $uri/ /giant/index.html;
}

# Vite 해시 에셋 — 장기 캐시(immutable)
location /giant/assets/ {
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}

# 프록시: /giant/api/* → 127.0.0.1:3600/api/*
location /giant/api/ {
    proxy_pass http://127.0.0.1:3600/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SSE 스트리밍: 버퍼링 끄고 즉시 flush (chat/stream 용)
    proxy_buffering off;
    proxy_cache off;
}
